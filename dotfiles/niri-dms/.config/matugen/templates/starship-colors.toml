"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
$hostname\
$shell\
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$fill\
$time\
$line_break$character"""

# 使用自定义调色板名称
palette = 'daguo_semantic'

[palettes.daguo_semantic]
# ==========================================
# 动态语义色彩映射 (基于 Matugen MD3 变量)
# ==========================================

# 1. 核心视觉焦点 (OS、当前目录、成功提示符)
color_core     = '{{colors.primary.default.hex}}'

# 2. 身份标识 (用户名、主机名)
color_user     = '{{colors.tertiary.default.hex}}'
color_host     = '{{colors.secondary.default.hex}}'

# 3. 版本控制 (Git 分支与状态)
color_git      = '{{colors.tertiary.default.hex}}'

# 4. 编程语言与环境 (分类映射，避免色彩堆砌)
color_lang_sys = '{{colors.secondary.default.hex}}'       # 底层/系统级 (C, Rust, Go)
color_lang_web = '{{colors.tertiary.default.hex}}'        # 脚本/前端 (Python, Node, PHP)
color_lang_jvm = '{{colors.inverse_primary.default.hex}}' # JVM/函数式 (Java, Kotlin)

# 5. 辅助与状态指示
color_muted    = '{{colors.outline.default.hex}}'         # 弱化文本 (时间、符号)
color_error    = '{{colors.error.default.hex}}'           # 错误状态
color_bg_dim   = '{{colors.surface_container.default.hex}}' # 模块底色 (Docker)
color_fg_base  = '{{colors.on_surface.default.hex}}'      # 基础文字色


# ==========================================
# 模块配置区
# ==========================================

[os]
disabled = false
format = '[$symbol ](bold color_core)'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
format = '[$user](bold color_user)[@](color_muted)'

[hostname]
disabled = false
ssh_only = false
format = '[$hostname](bold color_host) '

[shell]
fish_indicator = '󰈺'
bash_indicator = '_'
powershell_indicator = '󰨊'
unknown_indicator = ''
style = 'color_core bold'
disabled = false

[directory]
format = "[$path ](bold color_core)"
truncation_length = 6
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""

[git_branch]
symbol = ""
format = '[$symbol $branch ](color_git)'

[git_status]
format = '[($all_status$ahead_behind )](color_git)'

# --- 编程语言分组 ---

# [系统级语言]
[c]
symbol = " "
format = '[$symbol( $version) ](color_lang_sys)'

[cpp]
symbol = " "
format = '[$symbol( $version) ](color_lang_sys)'

[rust]
symbol = ""
format = '[$symbol( $version) ](color_lang_sys)'

[golang]
symbol = ""
format = '[$symbol( $version) ](color_lang_sys)'

# [脚本/Web语言]
[nodejs]
symbol = ""
format = '[$symbol( $version) ](color_lang_web)'

[python]
symbol = ""
format = '[$symbol( $version)(\($virtualenv\)) ](color_lang_web)'

[php]
symbol = ""
format = '[$symbol( $version) ](color_lang_web)'

# [JVM/函数式语言]
[java]
symbol = ""
format = '[$symbol( $version) ](color_lang_jvm)'

[kotlin]
symbol = ""
format = '[$symbol( $version) ](color_lang_jvm)'

[haskell]
symbol = ""
format = '[$symbol( $version) ](color_lang_jvm)'

# -------------------

[docker_context]
symbol = ""
format = '[[$symbol( $context) ](fg:color_fg_base bg:color_bg_dim)]($style)'

[fill]
disabled = false
symbol = ' '

[time]
disabled = false
format = '[ $time](color_muted)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[\$](bold color_core)'
error_symbol = '[\$](bold color_error)'